name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Prepare bundled tools (portable Node + pnpm)
        shell: pwsh
        run: |
          $nodeZip = Join-Path $env:TEMP 'node.zip'
          Invoke-WebRequest -Uri 'https://nodejs.org/dist/v22.23.2/node-v22.23.2-win-x64.zip' -OutFile $nodeZip
          Expand-Archive $nodeZip (Join-Path $env:TEMP 'node')
          New-Item -ItemType Directory -Force -Path 'tools/node' | Out-Null
          Copy-Item (Join-Path $env:TEMP 'node\node-v22.23.2-win-x64\*') 'tools/node' -Recurse -Force
          $pnpmZip = Join-Path $env:TEMP 'pnpm.zip'
          Invoke-WebRequest -Uri 'https://github.com/pnpm/pnpm/releases/download/v11.7.0/pnpm-win32-x64.zip' -OutFile $pnpmZip
          Expand-Archive $pnpmZip 'tools'
          Write-Host "bundled node: $(& 'tools\node\node.exe' --version)"
          Write-Host "bundled pnpm: $(& 'tools\pnpm.exe' --version)"

      - name: Download official source snapshot (bundled for offline first run)
        shell: pwsh
        run: |
          curl.exe -L --fail --retry 3 --connect-timeout 30 -o 'src-tauri/dsh-runtime-snapshot.zip' 'https://codeload.github.com/deepseek-ai/deepseek-harness/zip/refs/heads/main'
          Write-Host "snapshot size: $((Get-Item 'src-tauri/dsh-runtime-snapshot.zip').Length)"

      - name: Build installer (NSIS)
        shell: pwsh
        run: |
          $env:PATH = "$env:GITHUB_WORKSPACE\tools;$env:PATH"
          pnpm dlx @tauri-apps/cli@2 build --bundles nsis

      - name: Upload installer to Release
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*setup.exe
          generate_release_notes: true
